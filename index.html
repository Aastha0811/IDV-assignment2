<!-- Image 008 -->
<div class="box">
  <h2>Image 008 - Stack</h2>
  <svg width="360" height="508" viewBox="0 0 180 254" font-size="11">
    <defs>
      <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff2a2a"/>
        <stop offset="0.45" stop-color="#ff8f8f"/>
        <stop offset="1" stop-color="#e01010"/>
      </linearGradient>
      <marker id="arrow5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 z" fill="black"/>
      </marker>
    </defs>

    <!-- blocks on top -->
    <rect x="8" y="9" width="72" height="24" fill="url(#red)" stroke="darkred"/>
    <rect x="100" y="9" width="72" height="24" fill="url(#red)" stroke="darkred"/>

    <!-- push button -->
    <g class="btn" onclick="push()">
      <rect x="20" y="36" width="60" height="46" fill="transparent"/>
      <line x1="40" y1="38" x2="74" y2="80" stroke="black" marker-end="url(#arrow5)"/>
      <text x="51" y="73" text-anchor="end">push</text>
    </g>

    <!-- pop button -->
    <g class="btn" onclick="pop()">
      <rect x="100" y="36" width="54" height="48" fill="transparent"/>
      <line x1="106" y1="82" x2="126" y2="40" stroke="black" marker-end="url(#arrow5)"/>
      <text x="130" y="73">pop</text>
    </g>

    <!-- container -->
    <path d="M45,88 V230 Q45,240 55,240 H125 Q135,240 135,230 V88" fill="none" stroke="#9999ff" stroke-width="4"/>

    <!-- blocks inside -->
    <rect id="b1" x="54" y="162" width="72" height="25" fill="url(#red)" stroke="darkred"/>
    <rect id="b2" x="54" y="126" width="72" height="25" fill="url(#red)" stroke="darkred"/>
    <rect id="b3" x="54" y="90" width="72" height="25" fill="url(#red)" stroke="darkred"/>
    <text id="peek" x="141" y="106">peek</text>

    <polygon points="55,216 90,199 125,216" fill="#9999ff"/>
  </svg>
  <p>Click push or pop</p>
</div>

<script>
  // stack push and pop
  var count = 3;
  var peekY = [178, 142, 106];

  function showBlocks() {
    for (var i = 1; i <= 3; i++) {
      if (i <= count) {
        document.getElementById("b" + i).style.display = "inline";
      } else {
        document.getElementById("b" + i).style.display = "none";
      }
    }
    var peek = document.getElementById("peek");
    if (count == 0) {
      peek.style.display = "none";
    } else {
      peek.style.display = "inline";
      peek.setAttribute("y", peekY[count - 1]);
    }
  }

  function push() {
    if (count < 3) {
      count++;
      showBlocks();
    }
  }

  function pop() {
    if (count > 0) {
      count--;
      showBlocks();
    }
  }

  // gradient descent: redraw the red path one step at a time
  var points = ["503,1077", "660,970", "740,885", "785,825", "815,775"];

  document.getElementById("gd").onclick = function () {
    var n = 2;
    var path = document.getElementById("path");
    path.setAttribute("points", points.slice(0, n).join(" "));
    var timer = setInterval(function () {
      n++;
      path.setAttribute("points", points.slice(0, n).join(" "));
      if (n == points.length) {
        clearInterval(timer);
      }
    }, 400);
  };
</script>
